<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>RenalVision AI | Kidney Diagnostics</title>
    <link href="https://fonts.googleapis.com/css2?family=Outfit:wght@300;400;600;700&display=swap" rel="stylesheet">
    <link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.4.0/css/all.min.css">
    <style>
        :root {
            --primary: #3b82f6;
            --primary-dark: #2563eb;
            --secondary: #64748b;
            --bg: #0f172a;
            --card-bg: rgba(30, 41, 59, 0.7);
            --text-main: #f8fafc;
            --text-muted: #94a3b8;
            --success: #10b981;
            --danger: #ef4444;
            --glass-border: rgba(255, 255, 255, 0.1);
        }

        * {
            margin: 0;
            padding: 0;
            box-sizing: border-box;
            font-family: 'Outfit', sans-serif;
        }

        body {
            background-color: var(--bg);
            background-image: 
                radial-gradient(circle at 10% 20%, rgba(59, 130, 246, 0.05) 0%, transparent 40%),
                radial-gradient(circle at 90% 80%, rgba(59, 130, 246, 0.05) 0%, transparent 40%);
            color: var(--text-main);
            min-height: 100vh;
            display: flex;
            flex-direction: column;
            overflow-x: hidden;
        }

        /* Hero Section */
        header {
            padding: 2rem 1rem;
            text-align: center;
            animation: fadeInDown 0.8s ease-out;
        }

        header h1 {
            font-size: 2.5rem;
            font-weight: 700;
            background: linear-gradient(to right, #60a5fa, #3b82f6);
            -webkit-background-clip: text;
            background-clip: text;
            -webkit-text-fill-color: transparent;
            margin-bottom: 0.5rem;
        }

        header p {
            color: var(--text-muted);
            font-size: 1.1rem;
            letter-spacing: 1px;
        }

        /* Dashboard Layout */
        .dashboard {
            flex: 1;
            max-width: 1200px;
            margin: 0 auto;
            padding: 1rem 2rem 4rem;
            display: grid;
            grid-template-columns: 1fr 1fr;
            gap: 2.5rem;
            width: 100%;
        }

        .card {
            background: var(--card-bg);
            backdrop-filter: blur(12px);
            border: 1px solid var(--glass-border);
            border-radius: 24px;
            padding: 2rem;
            box-shadow: 0 25px 50px -12px rgba(0, 0, 0, 0.5);
            transition: transform 0.3s ease, box-shadow 0.3s ease;
        }

        .card:hover {
            transform: translateY(-5px);
            box-shadow: 0 30px 60px -12px rgba(0, 0, 0, 0.6);
        }

        .card-title {
            font-size: 1.25rem;
            font-weight: 600;
            margin-bottom: 1.5rem;
            display: flex;
            align-items: center;
            gap: 0.75rem;
            color: var(--primary);
        }

        /* Visual Area */
        .preview-area {
            position: relative;
            aspect-ratio: 1;
            background: rgba(15, 23, 42, 0.5);
            border: 2px dashed var(--glass-border);
            border-radius: 16px;
            overflow: hidden;
            display: flex;
            align-items: center;
            justify-content: center;
            margin-bottom: 1.5rem;
        }

        #photo {
            width: 100%;
            height: 100%;
            object-fit: contain;
            display: none;
            z-index: 2;
        }

        .placeholder-view {
            display: flex;
            flex-direction: column;
            align-items: center;
            gap: 1rem;
            color: var(--text-muted);
        }

        .placeholder-view i {
            font-size: 3rem;
        }

        /* Laser Scan Animation */
        .scanner-line {
            display: none;
            position: absolute;
            top: 0;
            left: 0;
            width: 100%;
            height: 4px;
            background: var(--primary);
            box-shadow: 0 0 15px var(--primary);
            z-index: 10;
            animation: scan 2s linear infinite;
        }

        @keyframes scan {
            0% { top: 0; }
            100% { top: 100%; }
        }

        /* Buttons */
        .controls {
            display: grid;
            grid-template-columns: 1fr 1fr;
            gap: 1rem;
        }

        .btn {
            border: none;
            padding: 1rem;
            border-radius: 12px;
            font-weight: 600;
            cursor: pointer;
            display: flex;
            align-items: center;
            justify-content: center;
            gap: 0.5rem;
            transition: all 0.2s ease;
            font-size: 1rem;
        }

        .btn-primary {
            background: var(--primary);
            color: white;
        }

        .btn-primary:hover {
            background: var(--primary-dark);
            box-shadow: 0 0 20px rgba(59, 130, 246, 0.4);
        }

        .btn-success {
            background: var(--success);
            color: white;
        }

        .btn-success:hover {
            box-shadow: 0 0 20px rgba(16, 185, 129, 0.4);
        }

        /* Results Area */
        .result-container {
            height: 100%;
            display: flex;
            flex-direction: column;
        }

        .result-badge {
            display: none;
            flex-direction: column;
            align-items: center;
            justify-content: center;
            padding: 2rem;
            border-radius: 16px;
            background: rgba(255, 255, 255, 0.03);
            border: 1px solid var(--glass-border);
            text-align: center;
            flex: 1;
            margin-bottom: 1rem;
            animation: zoomIn 0.5s cubic-bezier(0.175, 0.885, 0.32, 1.275);
        }

        .result-badge.visible {
            display: flex;
        }

        .res-icon {
            font-size: 4rem;
            margin-bottom: 1rem;
        }

        .res-text {
            font-size: 2rem;
            font-weight: 700;
            margin-bottom: 0.5rem;
        }

        .res-desc {
            color: var(--text-muted);
            line-height: 1.5;
        }

        .json-preview {
            background: rgba(0, 0, 0, 0.2);
            padding: 1rem;
            border-radius: 12px;
            font-family: 'Courier New', Courier, monospace;
            font-size: 0.85rem;
            color: #10b981;
            overflow-x: auto;
            max-height: 150px;
        }

        /* Loading Overlay */
        #loading {
            position: fixed;
            inset: 0;
            background: rgba(15, 23, 42, 0.8);
            backdrop-filter: blur(8px);
            z-index: 1000;
            display: none;
            align-items: center;
            justify-content: center;
            flex-direction: column;
            gap: 1.5rem;
        }

        .loader {
            width: 80px;
            height: 80px;
            border: 5px solid var(--glass-border);
            border-top: 5px solid var(--primary);
            border-radius: 50%;
            animation: spin 1s linear infinite;
        }

        @keyframes spin { 100% { transform: rotate(360deg); } }
        @keyframes fadeInDown {
            from { opacity: 0; transform: translateY(-20px); }
            to { opacity: 1; transform: translateY(0); }
        }
        @keyframes zoomIn {
            from { opacity: 0; transform: scale(0.9); }
            to { opacity: 1; transform: scale(1); }
        }

        footer {
            padding: 2rem;
            text-align: center;
            color: var(--text-muted);
            font-size: 0.9rem;
            border-top: 1px solid var(--glass-border);
            margin-top: auto;
        }

        @media (max-width: 850px) {
            .dashboard {
                grid-template-columns: 1fr;
            }
        }
    </style>
</head>
<body>
    <header>
        <h1>RenalVision AI</h1>
        <p>Deep Learning Diagnostics for Kidney Health</p>
    </header>

    <main class="dashboard">
        <!-- Diagnostic Input -->
        <section class="card">
            <h2 class="card-title">
                <i class="fa-solid fa-microscope"></i>
                Diagnostic Input
            </h2>
            <div class="preview-area" id="drop-area">
                <div class="scanner-line" id="scanner"></div>
                <div class="placeholder-view" id="placeholder">
                    <i class="fa-solid fa-cloud-arrow-up"></i>
                    <p>Upload CT Scan Image</p>
                </div>
                <img src="" id="photo" alt="Diagnosis Preview">
            </div>
            <div class="controls">
                <button class="btn btn-primary" id="uload">
                    <i class="fa-solid fa-folder-open"></i>
                    Upload
                </button>
                <button class="btn btn-success" id="send">
                    <i class="fa-solid fa-bolt"></i>
                    Analyze
                </button>
            </div>
            <!-- Hidden input -->
            <form id="upload-data" style="display:none;">
                <input type="hidden" id="url" value="../predict"/>
                <input type="file" id="fileinput" accept="image/*"/>
            </form>
        </section>

        <!-- Analysis Results -->
        <section class="card">
            <h2 class="card-title">
                <i class="fa-solid fa-chart-column"></i>
                Analysis Results
            </h2>
            <div class="result-container">
                <div class="result-badge" id="resultBadge">
                    <div class="res-icon" id="resIcon"></div>
                    <div class="res-text" id="resText">Analyzing...</div>
                    <div class="res-desc" id="resDesc">Please upload and analyze an image to see details.</div>
                </div>
            </div>
        </section>
    </main>

    <footer>
        <p>&copy; 2026 RenalVision AI Labs | Secure Diagnostic Environment</p>
    </footer>

    <div id="loading">
        <div class="loader"></div>
        <p style="font-weight: 600; color: var(--primary);">Analyzing Neural Pathways...</p>
    </div>

    <!-- Scripts -->
    <script src="https://ajax.googleapis.com/ajax/libs/jquery/3.4.1/jquery.min.js"></script>
    <script>
        var base_data = "";

        function updateResultCard(prediction) {
            const badge = document.getElementById('resultBadge');
            const icon = document.getElementById('resIcon');
            const text = document.getElementById('resText');
            const desc = document.getElementById('resDesc');
            
            badge.classList.add('visible');

            if (prediction === 'Tumor') {
                icon.innerHTML = '<i class="fa-solid fa-circle-exclamation" style="color: var(--danger);"></i>';
                text.innerText = 'TUMOR DETECTED';
                text.style.color = 'var(--danger)';
                desc.innerText = 'Neural analysis indicates signs of abnormal cell growth. Clinical consultation recommended.';
            } else {
                icon.innerHTML = '<i class="fa-solid fa-circle-check" style="color: var(--success);"></i>';
                text.innerText = 'NORMAL';
                text.style.color = 'var(--success)';
                desc.innerText = 'Kidney tissue appears consistent with typical healthy morphology within AI confidence interval.';
            }
        }

        function sendRequest(base64Data){
            if(!base64Data){
                alert("Please upload an image first.");
                return;
            }

            var url = $("#url").val();
            $("#loading").css('display', 'flex');
            $("#scanner").show();
            
            $.ajax({
                url : url,
                type: "post",
                contentType: 'application/json',
                data: JSON.stringify({image: base64Data}),
                success: function(res){
                    // Visual view
                    updateResultCard(res[0].image);
                    
                    $("#loading").hide();
                    $("#scanner").hide();
                },
                error: function() {
                    $("#loading").hide();
                    $("#scanner").hide();
                    alert("Analysis Failed. Please check server connection.");
                }
            });
        }

        $(document).ready(function(){
            $('#send').click(function(){
                sendRequest(base_data);
            });

            $('#uload').click(function() {
                $('#fileinput').trigger('click');
            });

            $("#fileinput").change(function(){
                if (this.files && this.files[0]){
                    var reader = new FileReader();
                    reader.onload = function (e){
                        var url = e.target.result;
                        var img = new Image();
                        img.onload = function(){
                            var canvas = document.createElement('CANVAS');
                            var ctx = canvas.getContext('2d');
                            canvas.height = this.height;
                            canvas.width = this.width;
                            ctx.drawImage(this, 0, 0);
                            base_data = canvas.toDataURL('image/jpeg', 1.0).replace(/^data:image.+;base64,/, '');
                            
                            $('#photo').attr('src', url).show();
                            $('#placeholder').hide();
                            // Reset result
                            $('#resultBadge').removeClass('visible');
                            $('#jsonOutput').text('Ready for analysis...');
                        };
                        img.src = url;
                    }
                    reader.readAsDataURL(this.files[0]);
                }
            });
        });
    </script>
</body>
</html>
